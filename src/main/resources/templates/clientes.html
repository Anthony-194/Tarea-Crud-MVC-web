<!DOCTYPE html>
<html>
  <head>
    <title>Registro de clientes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet">

    <style>
        .titulo-clientes {
            font-family: Arial, sans-serif;
            font-size: 36px;
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container mt-4">

        <h1 class="text-center mb-4 titulo-clientes">
            Registro de clientes
        </h1>

            <!-- MENSAJE DE ERROR -->
            <p th:if="${error}" 
               th:text="${error}" 
               class="alert alert-danger">
            </p>

            <!-- FORMULARIO -->
            <div class="col-md-6 mx-auto">

                <form th:action="@{/clientes/guardar}" 
                      th:object="${cliente}" 
                      method="post">

                    <input type="hidden" th:field="*{idClientes}">

                    <label>NIT:</label>
                    <input type="text" 
                           class="form-control mb-3" 
                           th:field="*{nit}">

                    <label>Nombre:</label>
                    <input type="text" 
                           class="form-control mb-3" 
                           th:field="*{nombre}">

                    <label>Apellido:</label>
                    <input type="text" 
                           class="form-control mb-3" 
                           th:field="*{apellidos}">

                    <label>Email:</label>
                    <input type="text" 
                           class="form-control mb-3" 
                           th:field="*{email}">

                    <!-- BOTÓN GUARDAR -->
                    <div class="text-center">
                        <button type="submit" 
                                class="btn btn-success">
                            Guardar
                        </button>
                    </div>

                </form>

            </div>

            <!-- TABLA DE CLIENTES -->
            <div class="mt-5">

                <table class="table table-striped table-hover">

                    <!-- ENCABEZADO DE LA TABLA -->
                    <thead class="table-primary">
                        <tr>
                            <th>Id</th>
                            <th>NIT</th>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <!-- DATOS -->
                    <tbody>

                        <tr th:each="c : ${clientes}">

                            <td th:text="${c.idClientes}"></td>
                            <td th:text="${c.nit}"></td>
                            <td th:text="${c.nombre}"></td>
                            <td th:text="${c.apellidos}"></td>
                            <td th:text="${c.email}"></td>

                            <td>

                                <!-- EDITAR -->
                                <a class="btn btn-outline-primary"
                                   th:href="@{/clientes/editar/{id}(id=${c.idClientes})}">
                                    Editar
                                </a>

                                <!-- ELIMINAR -->
                                <form th:action="@{/clientes/eliminar/{id}(id=${c.idClientes})}" 
                                      method="post"
                                      style="display:inline;">

                                    <button type="submit" 
                                            class="btn btn-outline-danger">
                                        Eliminar
                                    </button>

                                </form>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
                integrity="sha384-FKyoEForCGlyvwxhHj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
                crossorigin="anonymous">
        </script>

    </body>
</html>
